[package]
name = "kt2-incident-guard"
version = "0.1.0"
edition = "2021"

[dependencies]
csv = "1.3"
rand = { version = "0.9", features = ["small_rng"] }
rand_distr = "0.5"
rayon = "1.10"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
